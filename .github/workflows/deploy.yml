name: Deploy

# 提交到 main 后：在 GitHub Runner（7GB 内存）上构建前后端镜像 → 推送 GHCR
# → SSH 到服务器只做 git 同步 + docker compose pull/up（服务器不参与构建，规避 1.6GB 内存 OOM）。
on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一分支的部署串行执行，避免并发 push 互相打断
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build & push images (GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push server image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}-server:latest

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}-nginx:latest

  deploy:
    name: Deploy to server
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy (git sync + pull images + up)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          script: |
            cd /opt/clausemind
            git fetch --all
            git reset --hard origin/main
            docker compose pull server nginx
            docker compose up -d
            docker image prune -f
