services:
  # ── PostgreSQL 数据库 ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: clausemind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: workmind
      POSTGRES_USER: workmind
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workmind123}
    ports:
      # 容器间走内部网络 postgres:5432，无需对宿主机外暴露。
      # 默认仅绑定宿主机回环地址（生产安全）；本机 5432 被占用时在 .env 设 POSTGRES_PORT=5433
      - "${POSTGRES_PORT:-127.0.0.1:5432}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - clausemind-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workmind"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis 缓存 ────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: clausemind-redis
    restart: unless-stopped
    ports:
      # Redis 无密码，默认仅绑定宿主机回环地址，切勿暴露公网
      - "${REDIS_PORT:-127.0.0.1:6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - clausemind-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── 后端服务 ──────────────────────────────────────────────────
  server:
    # 本地开发用默认名（走 build）；生产在 .env 设 SERVER_IMAGE=ghcr.io/<owner>/<repo>-server:latest
    # 由 CI 构建镜像后 `docker compose pull server` 拉取，服务器无需本地构建。
    image: ${SERVER_IMAGE:-clausemind-server:dev}
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: clausemind-server
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - PRIMARY_MODEL=${PRIMARY_MODEL:-deepseek-chat}
      - VISION_MODEL=${VISION_MODEL:-deepseek-flash}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ZHIPU_API_KEY=${ZHIPU_API_KEY:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost}
      - CACHE_TTL=${CACHE_TTL:-1800000}
      - DATABASE_URL=postgresql://workmind:${POSTGRES_PASSWORD:-workmind123}@postgres:5432/workmind?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-workmind-jwt-secret-change-in-production}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-workmind-refresh-secret-change-in-production}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN:-30d}
      # 生产默认关闭控制台固定码通道；如需 SMTP 在 .env 配置 SMTP_* 变量
      - MAILER_CONSOLE=${MAILER_CONSOLE:-false}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_SECURE=${SMTP_SECURE:-true}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-ClauseMind <no-reply@clausemind.example>}
      - INTEGRATION_SECRET=${INTEGRATION_SECRET:-}
      # 转账收款码（收银台「转账支付」面板展示）
      - PAYMENT_QRCODE_URL=${PAYMENT_QRCODE_URL:-}
      # 购买入口总开关：设为 false 时前端隐藏定价/收银台/升级入口（ICP 备案审核期可用）
      - PAYMENT_ENABLED=${PAYMENT_ENABLED:-true}
      # 模拟支付白名单（白名单内账号可一键模拟支付）
      - PAY_SIMULATE_WHITELIST=${PAY_SIMULATE_WHITELIST:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./server/uploads:/app/uploads
    networks:
      - clausemind-net

  # ── Nginx 前端 + 反向代理 ─────────────────────────────────────
  nginx:
    # 生产在 .env 设 NGINX_IMAGE=ghcr.io/<owner>/<repo>-nginx:latest，由 CI 构建后 pull。
    image: ${NGINX_IMAGE:-clausemind-nginx:dev}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: clausemind-nginx
    restart: unless-stopped
    ports:
      # 生产默认 80；本机 80 被占用时在 .env 设 HTTP_PORT=8088
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - server
    networks:
      - clausemind-net

  # ── Adminer 数据库可视化（浏览器看 PostgreSQL 内容）────────────
  # 访问 http://localhost:8080（服务器用 http://服务器IP:8080）
  # 登录信息：系统选 PostgreSQL，服务器 postgres，账号 workmind，
  #          密码见 .env 的 POSTGRES_PASSWORD，数据库 workmind
  # 生产环境如不需要可删除本服务或仅绑定本机 127.0.0.1:8080:8080
  adminer:
    image: adminer:4-standalone
    container_name: clausemind-adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - clausemind-net

volumes:
  pg-data:
  redis-data:

networks:
  clausemind-net:
    driver: bridge
