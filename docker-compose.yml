version: "3.9"

services:
  # ── PostgreSQL 数据库 ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: workmind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: workmind
      POSTGRES_USER: workmind
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workmind123}
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - workmind-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workmind"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis 缓存 ────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: workmind-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - workmind-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── 后端服务 ──────────────────────────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: workmind-server
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ZHIPU_API_KEY=${ZHIPU_API_KEY:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost}
      - CACHE_TTL=${CACHE_TTL:-1800000}
      - DATABASE_URL=postgresql://workmind:${POSTGRES_PASSWORD:-workmind123}@postgres:5432/workmind?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-workmind-jwt-secret-change-in-production}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-workmind-refresh-secret-change-in-production}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN:-30d}
      # 生产默认关闭控制台固定码通道；如需 SMTP 在 .env 配置 SMTP_* 变量
      - MAILER_CONSOLE=${MAILER_CONSOLE:-false}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_SECURE=${SMTP_SECURE:-true}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-WorkMind <no-reply@workmind.example>}
      - INTEGRATION_SECRET=${INTEGRATION_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./server/uploads:/app/uploads
    networks:
      - workmind-net

  # ── Nginx 前端 + 反向代理 ─────────────────────────────────────
  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: workmind-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - workmind-net

volumes:
  pg-data:
  redis-data:

networks:
  workmind-net:
    driver: bridge
